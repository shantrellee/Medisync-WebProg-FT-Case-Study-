<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patients | Medisync Staff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="patient.css" />
    <link rel="stylesheet" href="staff.css" />
</head>

<body class="staff-body" data-page="patients">
    <div class="staff-layout">
        <aside class="sidebar">
            <a href="staff-dashboard.html" class="brand">Medi<span>sync</span></a>
            <nav class="side-nav" aria-label="Staff">
                <a href="staff-dashboard.html">Dashboard</a>
                <a href="staff-patients.html" class="active">Patients</a>
                <a href="staff-appointments.html">Appointments</a>
            </nav>
            <div class="side-foot">
                <p>Signed in as staff</p>
                <button type="button" id="logoutBtn" class="btn btn-outline btn-sm">
            Log out
          </button>
            </div>
        </aside>

        <main class="staff-main">
            <div class="staff-head">
                <h1>Patients</h1>
                <a href="staff-patient-form.html" class="btn btn-solid">+ Add patient</a
          >
        </div>

        <div id="staffMessage" class="page-message" role="status" hidden></div>

        <label for="patientSearch" class="visually-hidden"
          >Search patients</label
        >
        <input
          type="search"
          id="patientSearch"
          class="search-input"
          placeholder="Search by last name"
        />

        <section class="panel" aria-label="Patient records">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Contact</th>
                  <th class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody id="patientTableBody">
                <tr>
                  <td colspan="3" class="empty">
                    Loading...(placeholder di magloload hanggat di pa connected
                    sa backend)...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- View patient -->
        <!-- View patient (Clean CSS Version) -->
        <div id="patientModal" class="modal" hidden>
            <div class="modal-content">
                <h2 id="modalPatName" style="margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--text, #1F2937);">Patient Name</h2>
                
                <!-- Demographics Grid -->
                <div style="display: grid; grid-template-columns: 100px 1fr; gap: 0.8rem; margin-bottom: 2rem; font-size: 0.9rem;">
                    <span style="color: var(--muted, #6B7280);">Email</span>
                    <span id="modalPatEmail" style="color: var(--text, #1F2937);"></span>
                    
                    <span style="color: var(--muted, #6B7280);">Phone</span>
                    <span id="modalPatPhone" style="color: var(--text, #1F2937);"></span>
                    
                    <span style="color: var(--muted, #6B7280);">Birth Date</span>
                    <span id="modalPatDob" style="color: var(--text, #1F2937);"></span>
                    
                    <span style="color: var(--muted, #6B7280);">Sex</span>
                    <span id="modalPatSex" style="color: var(--text, #1F2937);"></span>
                    
                    <span style="color: var(--muted, #6B7280);">Address</span>
                    <span id="modalPatAddress" style="color: var(--text, #1F2937);"></span>
                </div>

                <h3 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--text, #1F2937);">Appointment history</h3>
                
                <!-- Scrollable History List -->
                <div id="modalPatHistory" style="max-height: 220px; overflow-y: auto; margin-bottom: 1.5rem; border-top: 1px solid var(--border, #E5EBE7); padding-top: 1rem;">
                    <!-- History injected here by JS -->
                </div>

                <!-- Action Area -->
                <div style="display: flex; justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" id="closePatientModal" onclick="document.getElementById('patientModal').hidden = true">Close</button>
                </div>
            </div>
        </div>
      </main>
    </div>

    <script src="api.js"></script>
    <script src="staff.js"></script>
  </body>
</html>

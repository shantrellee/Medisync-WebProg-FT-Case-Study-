<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add patient | Medisync Staff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="patient.css" />
    <link rel="stylesheet" href="staff.css" />
  </head>
  <body class="staff-body" data-page="patient-form">
    <div class="staff-layout">
      <aside class="sidebar">
        <a href="staff-dashboard.html" class="brand">Medi<span>sync</span></a>
        <nav class="side-nav" aria-label="Staff">
          <a href="staff-dashboard.html">Dashboard</a>
          <a href="staff-patients.html">Patients</a>
          <a href="staff-appointments.html">Appointments</a>
        </nav>
        <div class="side-foot">
          <p>Signed in as staff</p>
          <button type="button" id="logoutBtn" class="btn btn-outline btn-sm">Log out</button>
        </div>
      </aside>

      <main class="staff-main">
        <div class="staff-head"><h1 id="formTitle">Add patient</h1></div>

        <div id="staffMessage" class="page-message" role="alert" hidden></div>

        <section class="panel">
          <form id="patientForm" class="form-grid" novalidate>
            <div class="field">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" name="firstName" required />
            </div>
            <div class="field">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" name="lastName" required />
            </div>

            <div class="field">
              <label for="birthDate">Birth date</label>
              <input type="date" id="birthDate" name="birthDate" required />
            </div>
            <div class="field">
              <label for="sex">Sex</label>
              <select id="sex" name="sex" required>
                <option value="">Select</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
              </select>
            </div>

            <div class="field">
              <label for="contact">Contact number</label>
              <input type="tel" id="contact" name="contact" required />
            </div>
            <div class="field">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" />
            </div>

            <div class="form-actions">
              <button type="submit" id="patientSubmit" class="btn btn-solid">Save patient</button>
              <a href="staff-patients.html" class="btn btn-outline">Cancel</a>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="staff.js"></script>
  </body>
</html>

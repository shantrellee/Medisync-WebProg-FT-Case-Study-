<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create an account | Medisync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="login-page">
    <header class="site-header">
      <a href="index.html" class="brand">Medi<span>sync</span></a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-text">Back to home</a>
      </div>
    </header>

    <main class="login-main">
      <section class="login-card login-card-patient">
        <h1 id="register-title">Create an account</h1>
        <div id="registerMessage" class="login-message" hidden></div>

        <form id="registerForm" class="login-form" novalidate>
          <div class="login-field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>
          <div class="login-field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" required />
          </div>
          <div class="login-field">
            <label for="birthDate">Birth Date</label>
            <input type="date" id="birthDate" name="birthDate" required />
          </div>
          <div class="login-field">
            <label for="sex">Sex</label>
            <select id="sex" name="sex" required>
              <option value="">Select</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
            </select>
          </div>
          <div class="login-field">
            <label for="registerEmail">Email</label>
            <input
              type="email"
              id="registerEmail"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="login-field">
            <label for="registerContact">Contact number</label>
            <input
              type="tel"
              id="registerContact"
              name="contact"
              placeholder="e.g. 09123456789"
              maxlength="13"
              required
            />
          </div>
          <div class="login-field">
            <label for="registerPassword">Password</label>
            <div class="pw-wrap">
              <input
                type="password"
                id="registerPassword"
                name="password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="pw-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <img src="icons/eye.svg" width="20" height="20" alt="" />
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-solid btn-block">
            Create account
          </button>
        </form>

        <p class="login-alternative">
          Already registered? <a href="patient-login.html">Log in</a>
        </p>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="patient.js"></script>
  </body>
</html>
